<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#172554">
<title>Study Rank 2号</title>
<style>
:root{color-scheme:light;--navy:#172554;--blue:#2563eb;--muted:#64748b;--line:#e2e8f0;--bg:#f5f7fb;--green:#15803d;--amber:#b45309}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#172033;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif}
main{width:min(760px,100%);margin:auto;padding:clamp(10px,3.5vw,28px)}
header{background:var(--navy);color:#fff;padding:clamp(16px,4vw,24px);border-radius:20px;margin-bottom:16px}
.eyebrow{font-size:.8rem;letter-spacing:.12em;color:#bfdbfe}
h1{margin:7px 0;font-size:clamp(1.55rem,6vw,1.9rem)}
header p{margin:0;color:#dbeafe;line-height:1.6}
section{background:#fff;border:1px solid var(--line);border-radius:18px;padding:clamp(13px,3.5vw,18px);margin:14px 0}
h2{font-size:1.08rem;margin:0 0 12px}
.timer-hero{background:linear-gradient(135deg,#172554,#1d4ed8);color:#fff;text-align:center;padding:24px 18px;border:0;box-shadow:0 8px 22px #17255424}
button{min-height:48px;font:inherit;font-weight:750;border:0;border-radius:12px;padding:13px 20px;background:var(--blue);color:#fff;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.48;cursor:not-allowed}
.timer-hero button{width:min(100%,320px);min-height:62px;font-size:1.2rem}
.rankrow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.rank{font-size:1.7rem;font-weight:850;color:var(--navy)}
.character{width:108px;height:108px;object-fit:contain;flex:none}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.stat{background:#f1f5f9;padding:13px;border-radius:12px;min-width:0}
.stat small{display:block;color:var(--muted);line-height:1.4}
.stat strong{display:block;font-size:1.28rem;margin-top:3px;overflow-wrap:anywhere}
.study-meter{margin:27px 4px 4px;padding:6px 2px 0}
.meter-track{height:17px;background:#e2e8f0;border-radius:99px;position:relative;overflow:visible;margin:39px 2px 0}
.meter-fill{height:100%;width:0;background:linear-gradient(90deg,#60a5fa,#2563eb);border-radius:99px;transition:width .2s;position:relative;z-index:1}
.meter-walker{position:absolute;z-index:4;left:0;top:-43px;width:46px;height:46px;object-fit:contain;transform:translateX(-50%);transition:left .2s ease;pointer-events:none;filter:drop-shadow(0 2px 2px #17255420)}
.meter-tick-lines{position:absolute;inset:0;pointer-events:none;z-index:2}
.meter-tick{position:absolute;top:-5px;height:27px;width:2px;background:#334155;transform:translateX(-1px);border-radius:2px}
.meter-labels{height:23px;position:relative;font-size:.76rem;color:#475569;font-weight:700}
.meter-labels span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.meter-ends{display:flex;justify-content:space-between;align-items:center;margin-top:8px;color:#64748b;font-size:.82rem}
.meter-ends strong{font-size:.95rem;color:#1e3a8a}
.meter-caption{margin:7px 0 0;text-align:center;color:var(--muted);font-size:.84rem;line-height:1.5}

.muted{color:var(--muted);font-size:.9rem;line-height:1.65}
.status{background:#eff6ff;color:#1e40af;padding:12px;border-radius:11px;line-height:1.6}
.status.warn{background:#fff7ed;color:#9a3412}
.status.good{background:#f0fdf4;color:#166534}
.hidden{display:none!important}
footer{text-align:center;color:var(--muted);font-size:.8rem;padding:8px 0 22px}
.rank-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:10px}
.rank-item{padding:8px 10px;border-radius:9px;background:#f8fafc;color:#64748b;font-size:.85rem;display:flex;justify-content:space-between;gap:8px}
.rank-item.current{background:#dbeafe;color:#1e3a8a;font-weight:800;outline:1px solid #93c5fd}
@media(max-width:420px){.timer-hero{padding:18px 12px}.character{width:88px;height:88px}.rank{font-size:1.45rem}.stat{padding:10px}.stat strong{font-size:1.1rem}}
</style>
</head>
<body>
<main>
<header><div class="eyebrow">YOUR DAILY PROGRESS</div><h1>Study Rank <span style="font-size:.58em;color:#bfdbfe">2号</span></h1><p>毎日の勉強を、少しずつ積み上げよう。</p></header>

<section class="timer-hero">
 <button id="startBtn">▶ スタート</button>
</section>

<section id="rescuePanel" class="hidden">
 <h2>救済チャレンジ</h2>
 <div class="status warn" id="rescueInfo"></div>
 <button id="rescueBtn">救済チャレンジを開始</button>
 <p class="muted">進捗は10分ごとに自動保存されます。ブラウザを閉じても、保存された10分単位から再開できます。</p>
</section>

<section>
 <div class="rankrow">
  <div><h2>現在のランク</h2><div class="rank" id="rankName">小心者</div><div class="muted" id="rankSub">昇格まであと100日</div></div>
  <img class="character" id="character" alt="Study Rankのキャラクター">
 </div>
 <div class="study-meter" id="studyMeter" aria-label="勉強時間の進捗">
  <div class="meter-labels" id="meterTicks"></div>
  <div class="meter-track"><div class="meter-fill" id="meterFill"></div><div class="meter-tick-lines" id="meterTickLines"></div><img class="meter-walker" id="meterWalker" alt="進捗に合わせて進むキャラクター"></div>
  <div class="meter-ends"><span>0分</span><strong id="meterEndLabel">10分</strong></div>
  <p class="meter-caption" id="meterCaption">10分達成までの進捗</p>
 </div>
</section>

<section>
 <h2>ランク一覧</h2>
 <div class="rank-list" id="rankList"></div>
 <p class="muted">上位ランクは、1日10分達成した日数を積み重ねて昇格します。小心者より下は、1日10分達成するごとに1ランクずつ復帰します。</p>
</section>

<footer>Study Rank 2号 • 記録はこのブラウザに自動保存されます</footer>
</main>

function readInitial(){
  try {

    if(old){
      const x=JSON.parse(old);
      const d=fresh();
      d.dailySeconds=x.dailySeconds||{};
      d.totalSeconds=Number(x.totalSeconds)||((Number(x.total)||0)*60);
      d.rankIndex=Number.isInteger(x.rankIndex)?Math.max(0,Math.min(9,x.rankIndex)):5;
      
      d.totalStudyDays=Object.values(x.dailyContinuousSeconds||{}).filter(v=>Number(v)>=600).length;

function secondsForDay(key){return Number(data.dailySeconds[key])||0;}
function addSecondsToDay(key,seconds){
  data.dailySeconds[key]=(data.dailySeconds[key]||0)+seconds;
  data.totalSeconds=(data.totalSeconds||0)+seconds;
}
function splitSecondsByDate(startMs,endMs,secondsLimit){
  let cursor=startMs, remaining=secondsLimit;
  while(cursor<endMs && remaining>0){
    const d=new Date(cursor), key=dateKey(d);
    const midnight=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1).getTime();
    const available=Math.max(1,Math.floor((Math.min(endMs,midnight)-cursor)/1000));
    const part=Math.min(available,remaining);
    addSecondsToDay(key,part);
    cursor+=part*1000;
    remaining-=part;
  }
  if(remaining>0) addSecondsToDay(todayKey(),remaining);
}
function applyMissedDay(){
  // 救済チャレンジ用の連続欠席日数は全ランクで数える。
  data.missedDays=(data.missedDays||0)+1;
  if(data.rankIndex>5){
    // 1〜2日サボった間は降格せず猶予（救済チャレンジ可能）。
    // 3日連続でサボった時点（＝4日目）で完全にサボった判定となり、降格が始まる。
    if(data.missedDays>=3){
      data.rankIndex--;
      data.rankProgressDays=0;
      // 小心者に到達した次の日から、下位ランク用のマイナス日数を数え始める。
      if(data.rankIndex===5) data.smallRankMissedDays=0;
    }
  }else{
    data.smallRankMissedDays=(data.smallRankMissedDays||0)+1;
    for(let i=0;i<DEMOTION_THRESHOLDS.length;i++){
      if(data.smallRankMissedDays>=DEMOTION_THRESHOLDS[i]){
        const target=4-i;
        if(data.rankIndex>target){data.rankIndex=target;data.rankProgressDays=0;}
      }
    }
  }
}
function processPastDays(){
  // タイマー実行中は日数判定を止める（救済チャレンジが残っているだけなら日数は進む）。
  if(rescueSession||normalSession) return;
  const today=todayKey();
  let guard=0;
  // lastProcessedDate は「次に判定する日」。現在日より前の日を順番に確定する。
  while(data.lastProcessedDate<today && guard++<5000){
    const dateToFinalize=data.lastProcessedDate;
    if(!data.completedDays[dateToFinalize]){
      if(data.missedDays===0){
        data.absenceOrigin={rankIndex:data.rankIndex,rankProgressDays:data.rankProgressDays,totalStudyDays:data.totalStudyDays};
      }
      applyMissedDay();
    }else{
      data.missedDays=0;
      data.absenceOrigin=null;
    }
    data.lastProcessedDate=addDays(dateToFinalize,1);
  }
  if(data.rescue){
    // 3日連続でサボると救済は失効。それまでは日数に応じて必要時間が増える。
    if(data.missedDays>=3) data.rescue=null;
    else data.rescue.requiredSeconds=600*(data.missedDays+1);
  }
}
function rescueEligible(){
  return !data.rescue && data.missedDays>0 && data.missedDays<3;
}
function activateRescue(){
  if(!rescueEligible()) return;
  const origin=data.absenceOrigin||{rankIndex:data.rankIndex,rankProgressDays:data.rankProgressDays,totalStudyDays:data.totalStudyDays};
  data.rescue={
    requiredSeconds:600*(data.missedDays+1),
    progressSeconds:0,
    origin,
    startedDate:todayKey(),
    interrupted:false,
    lastSessionDate:todayKey()
  };
  save();
}
function promotionRequirement(){
  return PROMOTION_DAYS[data.rankIndex]||null;
}
function applyNormalAchievement(date){
  const already=!!data.completedDays[date];
  data.completedDays[date]=true;
  if(!already) data.totalStudyDays++;
  data.missedDays=0;
  data.smallRankMissedDays=0;
  data.absenceOrigin=null;
  if(data.rankIndex<5){
    data.rankIndex=Math.min(5,data.rankIndex+1);
    // 下位ランクから小心者に戻った達成日を、100日カウントの1日目にする。
    data.rankProgressDays=(data.rankIndex===5)?1:0;
  }else if(data.rankIndex<9){
    data.rankProgressDays++;
    const req=promotionRequirement();
    if(req && data.rankProgressDays>=req){
      data.rankIndex++;
      data.rankProgressDays=0;
    }
  }
}
function finishNormal(){
  if(!normalSession) return;
  const s=normalSession;
  const end=Date.now();
  splitSecondsByDate(s.startedAt,end,600);
  const completedOn=todayKey();
  // 日付をまたいで継続した通常タイマーは、途中の日付判定で誤って欠席扱いにしない。
  if(dateKey(new Date(s.startedAt))<completedOn) data.lastProcessedDate=completedOn;
  applyNormalAchievement(completedOn);
  normalSession=null;
  clearInterval(timerInterval); timerInterval=null;
  updateStudyMeter(600,600,false);
  save();
  $("startBtn").disabled=true;
  $("startBtn").textContent="本日の勉強達成済み";
  setCharacter("smile");
}
function startNormal(){
  if(normalSession || data.completedDays[todayKey()]) return;
  processPastDays();
  if(rescueEligible()) activateRescue();
  if(data.rescue) return;
  normalSession={startedAt:Date.now()};
  $("startBtn").disabled=true;
  $("startBtn").textContent="勉強中…";
  setCharacter("peek");
  timerInterval=setInterval(()=>{
    if(!normalSession) return;
    const elapsed=Math.floor((Date.now()-normalSession.startedAt)/1000);
    updateStudyMeter(Math.min(600,elapsed),600,false);
    if(elapsed>=600) finishNormal();
  },200);
}
function startRescue(){
  if(!data.rescue || rescueSession) return;
  rescueSession={startedAt:Date.now(),baseProgress:data.rescue.progressSeconds};
  data.rescue.lastSessionDate=todayKey();
  $("rescueBtn").disabled=true;
  $("rescueBtn").textContent="チャレンジ中…";
  setCharacter("peek");
  timerInterval=setInterval(tickRescue,200);
  tickRescue();
}
function tickRescue(){
  if(!rescueSession || !data.rescue) return;
  const elapsed=Math.floor((Date.now()-rescueSession.startedAt)/1000);
  const total=rescueSession.baseProgress+elapsed;
  const checkpoint=Math.floor(total/600)*600;
  if(checkpoint>data.rescue.progressSeconds){
    data.rescue.progressSeconds=checkpoint;
    save();
  }
  if(total>=data.rescue.requiredSeconds) finishRescue();
  else updateStudyMeter(total,data.rescue.requiredSeconds,true);
}
function finishRescue(){
  if(!rescueSession || !data.rescue) return;
  const r=data.rescue;
  const end=Date.now();
  const elapsed=Math.max(0,Math.floor((end-rescueSession.startedAt)/1000));
  const actualToRecord=Math.max(0,r.requiredSeconds-rescueSession.baseProgress);
  splitSecondsByDate(rescueSession.startedAt,end,actualToRecord);
  if(rescueSession.baseProgress>0) addSecondsToDay(todayKey(),rescueSession.baseProgress);
  const origin=r.origin||{rankIndex:data.rankIndex,rankProgressDays:0,totalStudyDays:data.totalStudyDays};
  if(!r.keepCurrentRankOnSuccess){
    data.rankIndex=origin.rankIndex;
    data.rankProgressDays=r.interrupted?0:origin.rankProgressDays;
  }else{
    // 10分未満で閉じた場合はサボり確定。後からチャレンジを完了しても元の進捗には戻さない。
    data.rankProgressDays=0;
  }
  data.totalStudyDays=Math.max(data.totalStudyDays,origin.totalStudyDays||0)+1;
  data.missedDays=0;
  data.smallRankMissedDays=0;
  data.absenceOrigin=null;
  data.completedDays[todayKey()]=true;
  // 救済成功日は達成済み。次に判定するのは「今日」（昨日にすると直後に欠席判定が再発する）。
  if(data.lastProcessedDate<todayKey()) data.lastProcessedDate=todayKey();
  data.rescue=null;
  rescueSession=null;
  clearInterval(timerInterval);timerInterval=null;
  save();
  setCharacter("smile");
}
function handlePageExit(){
  if(normalSession){
    normalSession=null;
    clearInterval(timerInterval);timerInterval=null;
  }
  if(rescueSession && data.rescue){
    const elapsed=Math.floor((Date.now()-rescueSession.startedAt)/1000);
    const total=rescueSession.baseProgress+elapsed;
    const checkpoint=Math.floor(total/600)*600;
    if(checkpoint>data.rescue.progressSeconds) data.rescue.progressSeconds=checkpoint;
    if(checkpoint>=600 && checkpoint<data.rescue.requiredSeconds){
      const origin=data.rescue.origin;
      data.rankIndex=origin.rankIndex;
      data.rankProgressDays=0;
      data.smallRankMissedDays=0;
      data.rescue.interrupted=true;
    }else if(checkpoint<600 && elapsed>0){
      // 10分未満で閉じた場合はサボり確定。救済ボタンと既存の10分単位進捗は残す。
      data.rescue.keepCurrentRankOnSuccess=true;
    }
    // 10分未満の場合は、すでに確定したサボり状態を取り消さない。
    rescueSession=null;
    clearInterval(timerInterval);timerInterval=null;
    try{localStorage.setItem(STORE_KEY,JSON.stringify(data));}catch(e){}
  }
}
function updateStudyMeter(valueSeconds, requiredSeconds, rescueMode=false){
  const target=Math.max(600,requiredSeconds||600);
  const value=Math.max(0,Math.min(target,valueSeconds||0));
  const progressPercent=value/target*100;
  $("meterFill").style.width=progressPercent+"%";
  $("meterWalker").style.left=progressPercent+"%";
  $("meterEndLabel").textContent=(target/60)+"分";
  $("meterCaption").textContent=rescueMode
    ? `救済チャレンジの進捗：${Math.floor(value/60)}分 ／ ${target/60}分`
    : "10分達成までの進捗";
  const labels=[], lines=[];
  if(rescueMode){
    for(let sec=600;sec<target;sec+=600){
      const pct=sec/target*100;
      labels.push(`<span style="left:${pct}%">${sec/60}分</span>`);
      lines.push(`<i class="meter-tick" style="left:${pct}%"></i>`);
    }
  }
  $("meterTicks").innerHTML=labels.join("");
  $("meterTickLines").innerHTML=lines.join("");
}
function setCharacter(state){
  const map={basic:"basic",peek:"peek",smile:"smile",sleep:"sleep",surprised:"surprised",back:"back"};
  const src=IMAGES[map[state]||"basic"];
  $("character").src=src;
  $("meterWalker").src=src;
}
function render(){
  const rank=RANKS[data.rankIndex]||RANKS[5];
  $("rankName").textContent=rank.name;
  const req=promotionRequirement();
  if(data.rankIndex<5){
    $("rankSub").textContent="10分達成で次のランクへ1段階復帰";
  }else if(req){
    $("rankSub").textContent=`次のランクまで あと${Math.max(0,req-data.rankProgressDays)}日`;
  }else{
    $("rankSub").textContent="最高ランク";
  }
  const normalElapsed=normalSession?Math.min(600,Math.floor((Date.now()-normalSession.startedAt)/1000)):(data.completedDays[todayKey()]?600:0);
  updateStudyMeter(normalElapsed,600,false);
  $("rankList").innerHTML=RANKS.slice().reverse().map((r,i)=>{
    const idx=RANKS.length-1-i;
    const unlocked=(data.reachedRanks||[]).includes(idx)||idx===data.rankIndex;
    const label=unlocked?r.name:"？？？";
    return `<div class="rank-item ${idx===data.rankIndex?"current":""}"><span>${label}</span><span>${idx===data.rankIndex?"現在":""}</span></div>`;
  }).join("");
  if(data.rescue){
    $("rescuePanel").classList.remove("hidden");
    $("rescueInfo").textContent=`サボった日数：${Math.min(2,data.missedDays)}日。救済には合計${data.rescue.requiredSeconds/60}分の勉強が必要です。今日を含めあと${3-Math.min(2,data.missedDays)}日以内に救済しないと、完全にサボった判定となり降格が始まります。`;
    updateStudyMeter(rescueSession?rescueSession.baseProgress+Math.floor((Date.now()-rescueSession.startedAt)/1000):data.rescue.progressSeconds,data.rescue.requiredSeconds,true);
    $("rescueBtn").textContent=rescueSession?"チャレンジ中…":"▶ 救済チャレンジを開始";
    $("rescueBtn").disabled=!!rescueSession;
    $("startBtn").classList.add("hidden");
    setCharacter(rescueSession?"peek":"surprised");
  }else{
    $("rescuePanel").classList.add("hidden");
    $("startBtn").classList.remove("hidden");
    const done=!!data.completedDays[todayKey()];
    $("startBtn").disabled=done||!!normalSession;
    $("startBtn").textContent=done?"本日の勉強達成済み":normalSession?"勉強中…":"▶ スタート";
  }
  if(!normalSession && !rescueSession && !data.rescue) setCharacter(data.rankIndex<5?"sleep":"basic");
}
$("startBtn").addEventListener("click",startNormal);
$("rescueBtn").addEventListener("click",startRescue);
window.addEventListener("pagehide",handlePageExit);
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible"){
    if(!normalSession && !rescueSession){
      processPastDays();
      if(rescueEligible()) activateRescue();
    }
    save();
  }
});
processPastDays();
if(rescueEligible()) activateRescue();
render();
// タブを開いたまま日付をまたいだ場合も判定・表示を更新する。
let lastDay=todayKey();
setInterval(()=>{
  const t=todayKey();
  if(t!==lastDay && !normalSession && !rescueSession){
    lastDay=t;
    processPastDays();
    if(rescueEligible()) activateRescue();
    save();
  }
},30000);
</script>
